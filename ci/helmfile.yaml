repositories:
  - name: bitnami
    url: https://mirror.yandex.ru/helm/charts.bitnami.com

releases:
  - name: inner-circle-invoices-api
    labels:
      app: inner-circle-invoices-api
    wait: true
    chart: bitnami/aspnet-core
    version: 4.4.7
    values:
      - values.yaml
      - image:
          tag: "{{ .StateValues.image.tag }}"
      - ingress:
          hostname: "{{ .StateValues.ingress.hostname }}"
      - extraSecretEnvVars:
          AuthenticationOptions__PublicSigningKey: "{{ .StateValues.extraSecretEnvVars.AuthenticationOptions__PublicSigningKey }}"
          ExternalDepsUrls__EmployeesApiRootUrl: "{{ .StateValues.extraSecretEnvVars.ExternalDepsUrls__EmployeesApiRootUrl }}"
          ExternalDepsUrls__TimeApiRootUrl: "{{ .StateValues.extraSecretEnvVars.ExternalDepsUrls__TimeApiRootUrl }}"
